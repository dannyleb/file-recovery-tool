[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "filerecovery"
version = "0.1.0"
description = "Recover permanently deleted files from a disk by carving it for known file signatures."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
filerecovery     = "filerecovery.cli:main"
filerecovery-gui = "filerecovery.gui:main"

[project.optional-dependencies]
gui = ["PyQt6", "Pillow>=10.0"]

[tool.setuptools]
packages = ["filerecovery"]
