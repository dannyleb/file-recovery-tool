<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Recovery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #007AFF;
      --green:   #34C759;
      --orange:  #FF9500;
      --red:     #FF3B30;
      --bg:      #F2F2F7;
      --surface: #FFFFFF;
      --border:  #D1D1D6;
      --border2: #E5E5EA;
      --text:    #1C1C1E;
      --text2:   #3A3A3C;
      --text3:   #8E8E93;
      --sidebar-bg: #F2F2F7;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ================================================================
       TOOLBAR
    ================================================================ */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #F5F5F7;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .tb-btn {
      border: 1px solid #C7C7CC;
      border-radius: 6px;
      padding: 3px 11px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tb-btn:hover:not(:disabled)   { background: #E5E5EA; }
    .tb-btn:active:not(:disabled)  { background: #D1D1D6; }
    .tb-btn:disabled { color: #AEAEB2; border-color: var(--border2); background: #F5F5F7; cursor: default; }
    .tb-btn.primary  { background: var(--blue); color: white; border-color: var(--blue); }
    .tb-btn.primary:hover:not(:disabled) { opacity: 0.85; background: var(--blue); }

    .tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }

    .tb-spacer { flex: 1; }

    #type-filter {
      border: 1px solid #C7C7CC;
      border-radius: 6px;
      padding: 3px 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      min-width: 130px;
    }

    /* ================================================================
       MAIN LAYOUT
    ================================================================ */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ================================================================
       SIDEBAR
    ================================================================ */
    #sidebar {
      width: 220px;
      min-width: 160px;
      max-width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 8px 0;
      user-select: none;
    }

    .sidebar-section {
      font-size: 10px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 10px 14px 4px;
    }

    .scan-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 6px;
      margin: 1px 6px;
      cursor: pointer;
      line-height: 1.3;
    }
    .scan-item:hover   { background: #E5E5EA; }
    .scan-item.active  { background: var(--blue); color: white; }
    .scan-item .scan-label { flex: 1; min-width: 0; }
    .scan-item .scan-name  { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scan-item .scan-sub   { font-size: 11px; color: var(--text3); }
    .scan-item.active .scan-sub { color: rgba(255,255,255,0.75); }
    .scan-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .scan-dot.done    { background: var(--green); }
    .scan-dot.running { background: var(--orange); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ================================================================
       CENTER PANEL
    ================================================================ */
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Table header */
    #table-head {
      display: grid;
      grid-template-columns: 32px 44px 68px 86px 76px 130px 86px;
      background: #F2F2F7;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .th {
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      border-right: 1px solid var(--border2);
      user-select: none;
    }
    .th:last-child { border-right: none; }
    .th:hover { background: #E9E9EF; }
    .th .sort-arrow { color: var(--text3); margin-left: 3px; }

    /* Table body */
    #table-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .file-row {
      display: grid;
      grid-template-columns: 32px 44px 68px 86px 76px 130px 86px;
      border-bottom: 1px solid #F4F4F8;
      cursor: pointer;
      align-items: center;
    }
    .file-row:nth-child(even) { background: #F9F9FB; }
    .file-row:hover  { background: #EEF4FF; }
    .file-row.selected { background: #D0E8FF; }

    .td {
      padding: 5px 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .td.right { text-align: right; }
    .td.icon  { font-size: 16px; text-align: center; padding: 4px 0; }

    .status-recovered { color: var(--green); font-weight: 500; }
    .status-truncated { color: var(--orange); }

    /* Pagination */
    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 12px;
      border-top: 1px solid var(--border2);
      background: #FAFAFA;
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text3);
    }
    .page-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 5px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .page-btn:hover:not(:disabled) { background: var(--bg); }
    .page-btn:disabled { opacity: 0.4; cursor: default; }

    /* Progress bar */
    #progress-wrap {
      height: 4px;
      background: var(--border2);
      flex-shrink: 0;
      display: none;
    }
    #progress-fill {
      height: 4px;
      background: var(--blue);
      transition: width 0.4s ease;
    }
    #progress-fill.done { background: var(--green); }

    /* ================================================================
       PREVIEW PANEL
    ================================================================ */
    #preview {
      width: 220px;
      min-width: 180px;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    #preview-header {
      padding: 10px 14px 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text3);
      border-bottom: 1px solid var(--border2);
      flex-shrink: 0;
    }
    #preview-img-wrap {
      width: 160px;
      height: 160px;
      margin: 14px auto 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      overflow: hidden;
      flex-shrink: 0;
    }
    #preview-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
    #preview-icon { display: block; }
    #preview-meta {
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.8;
      overflow-y: auto;
      flex: 1;
    }
    #preview-meta .meta-row { display: flex; gap: 6px; }
    #preview-meta .meta-key { color: var(--text3); min-width: 56px; flex-shrink: 0; }
    #preview-meta .meta-val { word-break: break-all; }
    #preview-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      font-size: 12px;
      text-align: center;
      padding: 20px;
    }

    /* ================================================================
       STATUS BAR
    ================================================================ */
    #statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 12px;
      background: #F2F2F7;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text2);
      flex-shrink: 0;
    }
    #status-right { color: var(--text3); }

    /* ================================================================
       LANDING / EMPTY STATES
    ================================================================ */
    #landing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text3);
      text-align: center;
      padding: 40px;
    }
    #landing .big-icon { font-size: 60px; }
    #landing h2 { font-size: 18px; font-weight: 600; color: var(--text2); }
    #landing p  { font-size: 13px; max-width: 320px; line-height: 1.6; }

    #no-files {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      font-size: 13px;
    }

    /* ================================================================
       ERROR / STALL BANNER
    ================================================================ */
    #error-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      background: #FFF0F0;
      border-bottom: 1px solid #FFCDD2;
      font-size: 12px;
      color: var(--red);
      flex-shrink: 0;
    }
    #error-banner.stall { background: #FFF8E1; border-color: #FFE082; color: #B45309; }
    #error-banner .err-icon { font-size: 14px; flex-shrink: 0; }
    #error-banner .err-msg  { flex: 1; }
    #error-banner .err-detail-btn {
      background: none; border: 1px solid currentColor; border-radius: 5px;
      padding: 2px 8px; font-size: 11px; cursor: pointer; color: inherit;
      white-space: nowrap;
    }

    /* Error log drawer */
    #error-log {
      display: none;
      flex-direction: column;
      border-top: 1px solid var(--border);
      background: #1C1C1E;
      color: #E5E5EA;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 11px;
      max-height: 160px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #error-log .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 12px;
      background: #2C2C2E;
      font-size: 11px;
      font-family: -apple-system, sans-serif;
      color: #AEAEB2;
      position: sticky; top: 0;
    }
    #error-log .log-header button {
      background: none; border: none; color: #AEAEB2; cursor: pointer; font-size: 13px; padding: 0 4px;
    }
    .log-entry {
      display: grid;
      grid-template-columns: 90px 90px 1fr;
      gap: 0 12px;
      padding: 4px 12px;
      border-bottom: 1px solid #2C2C2E;
      line-height: 1.5;
    }
    .log-entry .log-time  { color: #636366; }
    .log-entry .log-type  { color: #FF9F0A; }
    .log-entry .log-msg   { color: #FF453A; word-break: break-all; white-space: pre-wrap; }
    .log-entry .log-offset { color: #636366; font-size: 10px; }
    .log-no-errors { padding: 10px 12px; color: #636366; }

    /* ================================================================
       MODAL (CLI command overlay)
    ================================================================ */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px 28px;
      max-width: 540px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal h3 { font-size: 16px; margin-bottom: 8px; }
    .modal p  { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 14px; }
    .modal code {
      display: block;
      background: #1C1C1E;
      color: #E5E5EA;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="tb-btn primary" onclick="openDB()">Open DB…</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-open-source" onclick="openSource()" disabled>Open Source…</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-recover-sel" onclick="recoverSelected()" disabled>Recover Selected</button>
  <button class="tb-btn" id="btn-recover-all" onclick="recoverAll()" disabled>Recover All</button>
  <div class="tb-spacer"></div>
  <select id="type-filter" onchange="applyFilter()" disabled>
    <option value="">All Types</option>
  </select>
</div>

<!-- LAYOUT -->
<div id="layout">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-section">Scans</div>
    <div id="scans-list"></div>
  </div>

  <!-- CENTER -->
  <div id="center">

    <!-- Landing -->
    <div id="landing">
      <div class="big-icon">💾</div>
      <h2>File Recovery</h2>
      <p>Open a <code>recovery.db</code> scan database to browse found files and recover them.</p>
      <button class="tb-btn primary" style="padding:8px 22px;font-size:14px" onclick="openDB()">Open DB…</button>
      <p style="font-size:11px;color:var(--text3);margin-top:4px">Requires Chrome or Edge</p>
    </div>

    <!-- Table (hidden until DB open) -->
    <div id="table-head" class="hidden">
      <div class="th" onclick="sortBy('type')" style="grid-column:1/3">Type <span class="sort-arrow" id="sort-type"></span></div>
      <div class="th" onclick="sortBy('file_type')">Kind <span class="sort-arrow" id="sort-file_type"></span></div>
      <div class="th" onclick="sortBy('file_date')">Date <span class="sort-arrow" id="sort-file_date"></span></div>
      <div class="th" onclick="sortBy('length')" style="text-align:right">Size <span class="sort-arrow" id="sort-length"></span></div>
      <div class="th" onclick="sortBy('offset')" style="text-align:right">Offset <span class="sort-arrow" id="sort-offset"></span></div>
      <div class="th" onclick="sortBy('status')">Status <span class="sort-arrow" id="sort-status"></span></div>
    </div>
    <div id="table-scroll" class="hidden">
      <div id="table-body"></div>
      <div id="no-files">No files found yet</div>
    </div>
    <div id="pagination" class="hidden">
      <button class="page-btn" id="btn-prev" onclick="prevPage()">‹ Prev</button>
      <span id="page-info"></span>
      <button class="page-btn" id="btn-next" onclick="nextPage()">Next ›</button>
    </div>

    <!-- Progress bar -->
    <div id="progress-wrap">
      <div id="progress-fill" style="width:0%"></div>
    </div>

    <!-- Error / stall banner -->
    <div id="error-banner">
      <span class="err-icon">⚠</span>
      <span class="err-msg" id="error-banner-msg"></span>
      <button class="err-detail-btn" onclick="toggleErrorLog()">Show log</button>
    </div>

    <!-- Error log drawer -->
    <div id="error-log">
      <div class="log-header">
        <span>Error Log</span>
        <button onclick="toggleErrorLog()">✕</button>
      </div>
      <div id="error-log-body"></div>
    </div>

  </div>

  <!-- PREVIEW -->
  <div id="preview">
    <div id="preview-header">Preview</div>
    <div id="preview-empty">Select a file to preview</div>
    <div id="preview-content" class="hidden">
      <div id="preview-img-wrap">
        <span id="preview-icon"></span>
        <img id="preview-img" alt="preview">
      </div>
      <div id="preview-meta"></div>
    </div>
  </div>

</div>

<!-- STATUS BAR -->
<div id="statusbar">
  <span id="status-left">No database open</span>
  <span id="status-right" id="status-right"></span>
</div>

<!-- MODAL -->
<div id="modal" class="hidden">
  <div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 id="modal-title"></h3>
      <p id="modal-body"></p>
      <code id="modal-code" class="hidden"></code>
      <div class="modal-btns">
        <button class="tb-btn" onclick="closeModal()">Close</button>
        <button class="tb-btn" id="modal-copy-btn" onclick="copyModalCode()" class="hidden">Copy Command</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
'use strict';

// ============================================================
// STATE
// ============================================================
const S = {
  SQL: null,
  dbHandle: null,
  sourceHandle: null,
  serverUrl: null,       // e.g. "http://localhost:7523" when local server detected
  currentScanId: null,
  scans: [],             // [{id, source_path, source_size, bytes_scanned, started_at, finished_at}]
  allFiles: [],          // FoundFile objects for current scan
  filtered: [],          // after type filter
  sortCol: 'offset',
  sortDir: 1,            // 1=asc, -1=desc
  typeFilter: '',
  selectedIds: new Set(),
  page: 0,
  PAGE_SIZE: 100,
  pollTimer: null,
  refreshCountdown: 0,
};

const TYPE_ICONS = {
  JPEG:'🖼', PNG:'🖼', GIF:'🖼', BMP:'🖼',
  PDF:'📄', ZIP:'📦', WAV:'🎵',
  AVI:'🎬', MP4:'🎬', MOV:'🎬',
  SQLite:'🗄',
};

// ============================================================
// SQL.JS INIT
// ============================================================
async function initSQL() {
  if (S.SQL) return S.SQL;
  S.SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/${f}`
  });
  return S.SQL;
}

// ============================================================
// OPEN DB
// ============================================================
async function openDB() {
  if (!window.showOpenFilePicker) {
    alert('File System Access API required. Please use Chrome or Edge.');
    return;
  }
  let handle;
  try {
    [handle] = await window.showOpenFilePicker({
      types: [{ description: 'SQLite Database', accept: { 'application/octet-stream': ['.db'] } }],
    });
  } catch (e) { if (e.name !== 'AbortError') alert(e.message); return; }

  await initSQL();
  S.dbHandle = handle;
  await detectServer();

  // Show table UI
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('table-head').classList.remove('hidden');
  document.getElementById('table-scroll').classList.remove('hidden');
  document.getElementById('pagination').classList.remove('hidden');
  document.getElementById('btn-open-source').disabled = false;

  await refreshDB();
  startPolling();
}

// ============================================================
// LOCAL SERVER DETECTION
// ============================================================
async function detectServer() {
  // If the page itself is being served from localhost, we are the server
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    S.serverUrl = window.location.origin;
    setServerBadge(true);
    return;
  }
  const ports = [7523];
  for (const port of ports) {
    try {
      const r = await fetch(`http://localhost:${port}/api/status`, { signal: AbortSignal.timeout(800) });
      if (r.ok) {
        S.serverUrl = `http://localhost:${port}`;
        setServerBadge(true);
        return;
      }
    } catch (_) {}
  }
  S.serverUrl = null;
  setServerBadge(false);
}

function setServerBadge(connected) {
  let badge = document.getElementById('server-badge');
  if (!badge) {
    badge = document.createElement('span');
    badge.id = 'server-badge';
    badge.style.cssText = 'font-size:11px;padding:2px 8px;border-radius:100px;margin-left:6px;';
    document.getElementById('toolbar').appendChild(badge);
  }
  if (connected) {
    badge.textContent = '⬤ Server';
    badge.style.background = '#E8F5E9';
    badge.style.color = '#34C759';
    badge.title = 'Local server connected — image previews enabled';
  } else {
    badge.textContent = '⬤ No server';
    badge.style.background = '#F2F2F7';
    badge.style.color = '#8E8E93';
    badge.title = 'Run: sudo filerecovery serve --db /path/recovery.db --source /dev/rdisk2';
  }
}

// ============================================================
// OPEN SOURCE (for recovery)
// ============================================================
async function openSource() {
  if (!window.showOpenFilePicker) return;
  try {
    [S.sourceHandle] = await window.showOpenFilePicker({ multiple: false });
    setStatus('Source: ' + S.sourceHandle.name);
  } catch (e) { if (e.name !== 'AbortError') alert(e.message); }
}

// ============================================================
// READ & REFRESH
// ============================================================
async function refreshDB() {
  if (!S.dbHandle || !S.SQL) return;
  let db;
  try {
    const file = await S.dbHandle.getFile();
    const buf  = await file.arrayBuffer();
    db = new S.SQL.Database(new Uint8Array(buf));
  } catch (e) { console.error(e); return; }

  try {
    loadScans(db);
    if (S.currentScanId !== null) {
      loadFiles(db, S.currentScanId);
      updateProgress(db, S.currentScanId);
    }
  } finally { db.close(); }
}

function loadScans(db) {
  const res = db.exec('SELECT id,source_path,source_size,bytes_scanned,started_at,finished_at FROM scans ORDER BY id DESC');
  if (!res.length) return;
  S.scans = res[0].values.map(([id,src,size,done,start,fin]) => ({id,src,size,done,start,fin,updatedAt:0}));
  // fetch updatedAt separately
  try {
    const ua = db.exec('SELECT id, updated_at FROM scans ORDER BY id DESC');
    if (ua.length) ua[0].values.forEach(([id, upd]) => {
      const s = S.scans.find(x => x.id === id); if (s) s.updatedAt = upd;
    });
  } catch(e) {}

  const list = document.getElementById('scans-list');
  list.innerHTML = '';
  S.scans.forEach(s => {
    const pct = s.size ? Math.round(s.done/s.size*100) : 0;
    const div = document.createElement('div');
    div.className = 'scan-item' + (s.id === S.currentScanId ? ' active' : '');
    div.onclick = () => selectScan(s.id);
    div.innerHTML = `
      <span class="scan-dot ${s.fin ? 'done' : 'running'}"></span>
      <span class="scan-label">
        <div class="scan-name">Scan ${s.id} — ${basename(s.src)}</div>
        <div class="scan-sub">${s.fin ? 'Complete' : pct+'%  scanning…'}</div>
      </span>`;
    list.appendChild(div);
  });

  if (S.currentScanId === null && S.scans.length) {
    // Prefer the most recently updated in-progress scan, else most recent overall
    const running = S.scans.filter(s => !s.fin).sort((a,b) => b.updatedAt - a.updatedAt);
    selectScan(running.length ? running[0].id : S.scans[0].id);
  }
}

function selectScan(id) {
  S.currentScanId = id;
  S.selectedIds.clear();
  S.page = 0;
  S.typeFilter = '';
  document.getElementById('type-filter').value = '';

  // Highlight in sidebar
  document.querySelectorAll('.scan-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.querySelector('.scan-name').textContent) === id ||
      el.querySelector('.scan-name').textContent.startsWith('Scan ' + id + ' '));
  });

  refreshDB();
}

function loadFiles(db, scanId) {
  const res = db.exec(
    `SELECT id,file_type,extension,offset,length,truncated,file_date,recovered_path
     FROM found_files WHERE scan_id=${scanId} ORDER BY offset`
  );

  S.allFiles = res.length ? res[0].values.map(([id,ft,ext,off,len,trunc,date,recov]) => ({
    id, file_type:ft, extension:ext, offset:off, length:len,
    truncated:!!trunc, file_date:date, recovered_path:recov
  })) : [];

  // Rebuild type filter
  const types = [...new Set(S.allFiles.map(f => f.file_type))].sort();
  const sel = document.getElementById('type-filter');
  const prev = sel.value;
  sel.innerHTML = '<option value="">All Types</option>';
  types.forEach(t => { const o=document.createElement('option'); o.value=t; o.textContent=t; sel.appendChild(o); });
  if (prev && types.includes(prev)) sel.value = prev;
  sel.disabled = false;

  applyFilter();

  const scan = S.scans.find(s => s.id === scanId);
  const src  = scan ? basename(scan.src) : '?';
  setStatus(`Scan ${scanId}  ·  ${src}  ·  ${S.allFiles.length.toLocaleString()} files found`);

  document.getElementById('btn-recover-all').disabled = S.allFiles.length === 0;
  loadErrors(db, scanId);
}

function updateProgress(db, scanId) {
  const scan = S.scans.find(s => s.id === scanId);
  if (!scan) return;
  const pct = scan.size ? (scan.done / scan.size * 100) : 0;
  const wrap = document.getElementById('progress-wrap');
  const fill = document.getElementById('progress-fill');

  if (scan.fin) {
    wrap.style.display = 'none';
    fill.className = 'progress-fill done';
  } else {
    wrap.style.display = 'block';
    fill.className = 'progress-fill';
    fill.style.width = pct.toFixed(1) + '%';
  }
}

// ============================================================
// FILTER & SORT
// ============================================================
function applyFilter() {
  S.typeFilter = document.getElementById('type-filter').value;
  S.filtered = S.typeFilter
    ? S.allFiles.filter(f => f.file_type === S.typeFilter)
    : [...S.allFiles];
  S.page = 0;
  sortAndRender();
}

function sortBy(col) {
  if (S.sortCol === col) S.sortDir *= -1;
  else { S.sortCol = col; S.sortDir = 1; }
  sortAndRender();
}

function sortAndRender() {
  const col = S.sortCol;
  const dir = S.sortDir;
  S.filtered.sort((a, b) => {
    let av = a[col] ?? '', bv = b[col] ?? '';
    if (typeof av === 'number' || typeof bv === 'number') return dir * ((av||0) - (bv||0));
    return dir * String(av).localeCompare(String(bv));
  });
  // Update sort arrows
  ['type','file_type','file_date','length','offset','status'].forEach(c => {
    const el = document.getElementById('sort-'+c);
    if (el) el.textContent = c === col ? (dir===1 ? ' ↑' : ' ↓') : '';
  });
  renderPage();
}

// ============================================================
// RENDER TABLE
// ============================================================
const PAGE_SIZE = 100;

function renderPage() {
  const start = S.page * PAGE_SIZE;
  const end   = Math.min(start + PAGE_SIZE, S.filtered.length);
  const rows  = S.filtered.slice(start, end);

  const body = document.getElementById('table-body');
  const noFiles = document.getElementById('no-files');

  if (!rows.length && S.allFiles.length === 0) {
    body.innerHTML = '';
    noFiles.style.display = 'flex';
  } else {
    noFiles.style.display = 'none';
    body.innerHTML = rows.map(f => {
      const icon   = TYPE_ICONS[f.file_type] || '📁';
      const ext    = f.extension.replace(/^\./, '').toUpperCase();
      const date   = fmtDate(f.file_date);
      const size   = fmtSize(f.length);
      const offset = f.offset.toLocaleString();
      const status = f.recovered_path ? '<span class="status-recovered">Recovered</span>'
                   : f.truncated       ? '<span class="status-truncated">Truncated</span>'
                   : '';
      const sel = S.selectedIds.has(f.id) ? ' selected' : '';
      return `<div class="file-row${sel}" data-id="${f.id}" onclick="rowClick(event,${f.id})">
        <div class="td icon">${icon}</div>
        <div class="td">${ext}</div>
        <div class="td">${f.file_type}</div>
        <div class="td">${date}</div>
        <div class="td right">${size}</div>
        <div class="td right">${offset}</div>
        <div class="td">${status}</div>
      </div>`;
    }).join('');
  }

  // Pagination
  const total = S.filtered.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  document.getElementById('page-info').textContent =
    total ? `${start+1}–${end} of ${total.toLocaleString()}` : '0 files';
  document.getElementById('btn-prev').disabled = S.page === 0;
  document.getElementById('btn-next').disabled = S.page >= pages - 1;

  updateSelectionUI();
}

function prevPage() { if (S.page > 0) { S.page--; renderPage(); } }
function nextPage() {
  if ((S.page+1)*PAGE_SIZE < S.filtered.length) { S.page++; renderPage(); }
}

// ============================================================
// ROW SELECTION
// ============================================================
function rowClick(e, id) {
  if (e.shiftKey) {
    // range select
    const ids  = S.filtered.map(f => f.id);
    const last = [...S.selectedIds].pop();
    if (last !== undefined) {
      const a = ids.indexOf(last), b = ids.indexOf(id);
      const [lo, hi] = a < b ? [a,b] : [b,a];
      ids.slice(lo, hi+1).forEach(x => S.selectedIds.add(x));
    } else {
      S.selectedIds.add(id);
    }
  } else if (e.metaKey || e.ctrlKey) {
    if (S.selectedIds.has(id)) S.selectedIds.delete(id);
    else S.selectedIds.add(id);
  } else {
    S.selectedIds.clear();
    S.selectedIds.add(id);
  }
  renderPage();
  showPreview(id);
}

function updateSelectionUI() {
  const n = S.selectedIds.size;
  document.getElementById('btn-recover-sel').disabled = n === 0;
  document.getElementById('status-right').textContent = n ? `${n} selected` : '';

  document.querySelectorAll('.file-row').forEach(row => {
    const id = parseInt(row.dataset.id);
    row.classList.toggle('selected', S.selectedIds.has(id));
  });
}

// ============================================================
// PREVIEW
// ============================================================
function showPreview(id) {
  const f = S.allFiles.find(x => x.id === id);
  if (!f) return;

  document.getElementById('preview-empty').classList.add('hidden');
  document.getElementById('preview-content').classList.remove('hidden');

  const icon = TYPE_ICONS[f.file_type] || '📁';
  document.getElementById('preview-icon').textContent = icon;

  // Clear old image
  const img = document.getElementById('preview-img');
  img.style.display = 'none';
  img.src = '';
  document.getElementById('preview-icon').style.display = 'block';

  // Try to show image preview if source is open and it's an image
  const imgTypes = new Set(['JPEG','PNG','GIF','BMP']);
  if ((S.sourceHandle || S.serverUrl) && imgTypes.has(f.file_type)) {
    loadPreviewImage(f);
  }

  const status = f.recovered_path ? 'Recovered'
               : f.truncated       ? 'Truncated'
               : 'Found';
  const rows = [
    ['Type',   f.file_type],
    ['Ext',    '.' + f.extension],
    ['Size',   fmtSize(f.length)],
    ['Date',   fmtDate(f.file_date) || '—'],
    ['Offset', f.offset.toLocaleString()],
    ['Status', status],
  ];
  if (f.recovered_path) rows.push(['Saved', f.recovered_path]);

  document.getElementById('preview-meta').innerHTML = rows.map(([k,v]) =>
    `<div class="meta-row"><span class="meta-key">${k}</span><span class="meta-val">${v}</span></div>`
  ).join('');
}

async function loadPreviewImage(f) {
  const img = document.getElementById('preview-img');

  // Prefer local server (works with raw devices)
  if (S.serverUrl) {
    img.onload = () => {
      document.getElementById('preview-icon').style.display = 'none';
      img.style.display = 'block';
    };
    img.onerror = () => { img.style.display = 'none'; };
    img.src = `${S.serverUrl}/api/preview/${f.id}`;
    return;
  }

  // Fallback: File System Access API (works for image files, not raw devices)
  if (!S.sourceHandle) return;
  try {
    const file  = await S.sourceHandle.getFile();
    const slice = file.slice(f.offset, f.offset + Math.min(f.length, 512*1024));
    const mime  = f.file_type === 'JPEG' ? 'image/jpeg'
                : f.file_type === 'PNG'  ? 'image/png'
                : f.file_type === 'GIF'  ? 'image/gif'
                : 'image/bmp';
    const url   = URL.createObjectURL(new Blob([await slice.arrayBuffer()], { type: mime }));
    img.onload  = () => {
      document.getElementById('preview-icon').style.display = 'none';
      img.style.display = 'block';
    };
    img.src = url;
  } catch (_) {}
}

// ============================================================
// RECOVERY
// ============================================================
async function recoverSelected() {
  const files = S.allFiles.filter(f => S.selectedIds.has(f.id));
  await doRecover(files);
}

async function recoverAll() {
  await doRecover(S.filtered);
}

async function doRecover(files) {
  if (!files.length) return;

  const scan = S.scans.find(s => s.id === S.currentScanId);
  if (!scan) return;

  // If source is a raw device path (starts with /dev/) or source not open, show CLI command
  const isDevice = scan.src.startsWith('/dev/');
  if (!S.sourceHandle && isDevice) {
    showCLIRecovery(files, scan.src);
    return;
  }

  if (!S.sourceHandle) {
    const proceed = confirm(
      'No source file is open.\n\n' +
      'Click OK to open the source file/image, or Cancel to see the CLI command.'
    );
    if (proceed) {
      await openSource();
      if (!S.sourceHandle) return;
    } else {
      showCLIRecovery(files, scan.src);
      return;
    }
  }

  // Pick destination folder
  let destDir;
  try {
    destDir = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) { if (e.name !== 'AbortError') alert(e.message); return; }

  const sourceFile = await S.sourceHandle.getFile();
  let done = 0;
  const total = files.length;
  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('progress-fill').className = 'progress-fill';

  for (const f of files) {
    try {
      const bytes = await readSlice(sourceFile, f.offset, f.length);
      const name  = `${f.file_type.toLowerCase()}_${String(f.offset).padStart(12,'0')}.${f.extension}`;
      const fh    = await destDir.getFileHandle(name, { create: true });
      const w     = await fh.createWritable();
      await w.write(bytes);
      await w.close();
      done++;
      const pct = Math.round(done/total*100);
      document.getElementById('progress-fill').style.width = pct + '%';
      setStatus(`Recovering… ${done}/${total}: ${name}`);
    } catch (e) {
      console.error('Recovery failed for', f.id, e);
    }
  }

  document.getElementById('progress-wrap').style.display = 'none';
  setStatus(`Recovered ${done.toLocaleString()} files`);
  alert(`Recovered ${done} of ${total} files.`);
}

async function readSlice(file, offset, length) {
  const slice = file.slice(offset, offset + length);
  return new Uint8Array(await slice.arrayBuffer());
}

function showCLIRecovery(files, srcPath) {
  const ids = files.map(f => f.id).join(',');
  const cmd = files.length === S.allFiles.length
    ? `filerecovery recover ${S.currentScanId} --db=/Users/dannyleblanc/recovery.db --dest=~/recovered`
    : `filerecovery recover ${S.currentScanId} --ids=${ids} --db=/Users/dannyleblanc/recovery.db --dest=~/recovered`;

  showModal(
    'Recover via Terminal',
    `Source is a raw device (${srcPath}) — browsers can't read raw disks.\nRun this command in your terminal:`,
    cmd
  );
}

// ============================================================
// ERROR LOG
// ============================================================
function loadErrors(db, scanId) {
  const banner  = document.getElementById('error-banner');
  const bannerMsg = document.getElementById('error-banner-msg');
  const logBody = document.getElementById('error-log-body');

  // Query errors table (may not exist on older DBs)
  let errors = [];
  try {
    const res = db.exec(
      `SELECT occurred_at, error_type, message, offset FROM scan_errors
       WHERE scan_id=${scanId} ORDER BY occurred_at DESC LIMIT 200`
    );
    if (res.length) {
      errors = res[0].values.map(([ts, type, msg, off]) => ({ ts, type, msg, off }));
    }
  } catch (e) { /* table doesn't exist yet — ignore */ }

  // Stall detection: scan not finished but updated_at is old
  const scan = S.scans.find(s => s.id === scanId);
  const staleSecs = scan && !scan.fin ? (Date.now()/1000 - scan.updatedAt) : 0;
  const isStalled = staleSecs > 60;

  if (errors.length === 0 && !isStalled) {
    banner.style.display = 'none';
    return;
  }

  banner.style.display = 'flex';
  if (errors.length > 0) {
    banner.className = '';
    bannerMsg.textContent = `${errors.length} error${errors.length>1?'s':''} logged during scan`;
  } else if (isStalled) {
    banner.className = 'stall';
    const mins = Math.round(staleSecs / 60);
    bannerMsg.textContent = `Scan may have stopped — no progress for ${mins} minute${mins>1?'s':''}`;
  }

  if (errors.length === 0) {
    logBody.innerHTML = '<div class="log-no-errors">No errors recorded — scan appears stalled (check terminal)</div>';
    return;
  }

  logBody.innerHTML = errors.map(e => {
    const t = new Date(e.ts * 1000).toLocaleTimeString();
    const off = e.off != null ? `@ offset ${e.off.toLocaleString()}` : '';
    return `<div class="log-entry">
      <span class="log-time">${t}</span>
      <span class="log-type">${e.type}</span>
      <span class="log-msg">${escHtml(e.msg)} <span class="log-offset">${off}</span></span>
    </div>`;
  }).join('');
}

function toggleErrorLog() {
  const log = document.getElementById('error-log');
  log.style.display = log.style.display === 'flex' ? 'none' : 'flex';
  const btn = document.querySelector('#error-banner .err-detail-btn');
  if (btn) btn.textContent = log.style.display === 'flex' ? 'Hide log' : 'Show log';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// POLLING
// ============================================================
function startPolling() {
  if (S.pollTimer) clearInterval(S.pollTimer);
  let tick = 0;
  S.pollTimer = setInterval(async () => {
    const scan = S.scans.find(s => s.id === S.currentScanId);
    if (scan && scan.fin) { clearInterval(S.pollTimer); S.pollTimer = null; return; }
    await refreshDB();
    if (++tick % 3 === 0) detectServer(); // re-check server every ~9s
  }, 3000);
}

// ============================================================
// MODAL
// ============================================================
function showModal(title, body, code) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent  = body;
  const codeEl = document.getElementById('modal-code');
  const copyBtn = document.getElementById('modal-copy-btn');
  if (code) {
    codeEl.textContent = code;
    codeEl.classList.remove('hidden');
    copyBtn.classList.remove('hidden');
  } else {
    codeEl.classList.add('hidden');
    copyBtn.classList.add('hidden');
  }
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal()  { document.getElementById('modal').classList.add('hidden'); }
function copyModalCode() {
  navigator.clipboard.writeText(document.getElementById('modal-code').textContent);
  document.getElementById('modal-copy-btn').textContent = 'Copied!';
  setTimeout(() => { document.getElementById('modal-copy-btn').textContent = 'Copy Command'; }, 2000);
}

// ============================================================
// HELPERS
// ============================================================
function setStatus(msg) {
  document.getElementById('status-left').textContent = msg;
}
function basename(p) { return p ? p.replace(/^.*[/\\]/, '') : p; }
function fmtSize(n) {
  const u = ['B','KB','MB','GB','TB'];
  let i = 0;
  while (n >= 1024 && i < u.length-1) { n /= 1024; i++; }
  return (i===0 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
}
function fmtDate(ts) {
  if (!ts) return '';
  try { return new Date(ts*1000).toISOString().slice(0,10); } catch { return ''; }
}
